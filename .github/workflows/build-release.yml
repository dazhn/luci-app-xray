name: Build and Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_NAME: luci-app-xray

jobs:
  release:
    name: Build for ${{ matrix.arch }} (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 25.12
            arch: x86_64
            sdk_url_path: https://downloads.openwrt.org/releases/25.12.2/targets/x86/64
            sdk_name: -sdk-25.12.2-x86-64_

    env:
      SDK_URL_PATH: ${{ matrix.sdk_url_path }}
      SDK_NAME: ${{ matrix.sdk_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y aria2 gettext libncurses5-dev xsltproc zstd file

      - name: Download and Extract SDK
        run: |
          SDK_DIR="$(mktemp -d)"
          SDK_HOME="$(mktemp -d)"
          echo "SDK_HOME=$SDK_HOME" >> $GITHUB_ENV
          cd "$SDK_DIR"
          curl -fsSL "$SDK_URL_PATH/sha256sums" | grep -- "$SDK_NAME" > sha256sums.small
          cat sha256sums.small
          SDK_FILE="$(awk '{print $2}' sha256sums.small | sed 's/^\*//')"
          aria2c -x 16 -s 16 -k 1M --file-allocation=none -o "$SDK_FILE" "$SDK_URL_PATH/$SDK_FILE"
          sha256sum -c ./sha256sums.small
          tar -C "$SDK_HOME" --strip=1 -xf "$SDK_FILE"
          rm -rf "$SDK_DIR"

      - name: Build Packages
        run: |
          cd "$SDK_HOME"
          ln -s "${{ github.workspace }}" "package/$PACKAGE_NAME"
          make defconfig
          make package/${PACKAGE_NAME}/core/compile V=s
          make package/${PACKAGE_NAME}/status/compile V=s
          make package/${PACKAGE_NAME}/geodata/compile V=s
          find "$SDK_HOME/bin/" -type f \( -name "*.ipk" -o -name "*.apk" \) -exec ls -lh {} \;

      - name: Copy Bin Files
        run: |
          find "$SDK_HOME/bin/" -type f \( -name "${PACKAGE_NAME}*.ipk" -o -name "${PACKAGE_NAME}*.apk" \) | while read -r f; do
            base="$(basename "$f")"
            cp "$f" "${{ github.workspace }}/${base%.*}-${{ matrix.arch }}.${base##*.}"
          done
          find "${{ github.workspace }}" -maxdepth 1 -type f \( -name "*.ipk" -o -name "*.apk" \) -exec ls -lh {} \;

      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.7.2
          files: |
            *.ipk
            *.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}